<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50addoil 內容策劃師</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  body { font-family: 'Noto Sans TC', sans-serif; }
  .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,.08); }
  .tab-btn { transition: all .2s; }
  .tab-btn.active { background: #7c3aed; color: #fff; }
  .tab-btn:not(.active):hover { background: #f3f0ff; }
  .progress-bar { transition: width 0.6s ease; }
  .step-badge { display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 700; }
  .keyword-tag { background: #ede9fe; color: #5b21b6; border-radius: 20px;
    padding: 2px 10px; font-size: 12px; display: inline-block; margin: 2px; }
  .score-bar { height: 6px; border-radius: 3px; background: #e5e7eb; }
  .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  pre { white-space: pre-wrap; word-break: break-word; }
  .spinner { border: 3px solid #e9d5ff; border-top-color: #7c3aed;
    border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .rank-1 { background: linear-gradient(135deg, #fef3c7, #fde68a); border: 1px solid #f59e0b; }
  .rank-2 { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); border: 1px solid #94a3b8; }
  .rank-3 { background: linear-gradient(135deg, #fdf4e7, #fde8c8); border: 1px solid #d97706; }
  textarea.content-area { resize: vertical; min-height: 120px; }
  .copy-btn { opacity: 0; transition: opacity .2s; }
  .content-block:hover .copy-btn { opacity: 1; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header -->
<header class="gradient-bg text-white shadow-lg">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-xl">🔥</div>
      <div>
        <h1 class="text-xl font-bold">50addoil 內容策劃師</h1>
        <p class="text-purple-200 text-xs">AI 自動生成香港 50+ 受眾每日內容</p>
      </div>
    </div>
    <button onclick="toggleSettings()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
      ⚙️ API 設定
    </button>
  </div>
</header>

<!-- Settings Panel -->
<div id="settingsPanel" class="hidden bg-white border-b shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-5">
    <h2 class="font-semibold text-gray-700 mb-4">🔑 API 金鑰設定（儲存於瀏覽器）</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Claude API Key <span class="text-red-500">*必填</span></label>
        <input id="claudeKey" type="password" placeholder="sk-ant-api03-..."
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">SerpAPI Key <span class="text-gray-400">（選填，用於真實新聞搜索）</span></label>
        <input id="serpKey" type="password" placeholder="your-serpapi-key"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
      </div>
    </div>
    <div class="flex gap-3 mt-4">
      <button onclick="saveSettings()" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
        💾 儲存
      </button>
      <span id="saveMsg" class="text-green-600 text-sm self-center hidden">✓ 已儲存</span>
    </div>
  </div>
</div>

<!-- Main -->
<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

  <!-- Control Bar -->
  <div class="card p-5 flex flex-wrap items-end gap-4">
    <div>
      <label class="block text-sm text-gray-600 mb-1">📅 生成日期</label>
      <input type="date" id="genDate"
        class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
    </div>
    <button id="generateBtn" onclick="startGenerate()"
      class="bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed text-white px-7 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
      <span id="btnIcon">🚀</span>
      <span id="btnText">生成今日內容</span>
    </button>
    <button id="downloadBtn" onclick="downloadCSV()" disabled
      class="bg-green-600 hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-6 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
      ⬇️ 下載 CSV
    </button>
    <div id="metaBadge" class="hidden ml-auto">
      <span class="bg-purple-100 text-purple-700 text-xs px-3 py-1 rounded-full font-medium"></span>
    </div>
  </div>

  <!-- Progress -->
  <div id="progressBox" class="card p-5 hidden">
    <div class="flex items-center gap-3 mb-3">
      <div class="spinner" id="progressSpinner"></div>
      <span id="progressMsg" class="text-gray-700 font-medium">處理中…</span>
      <span id="progressPct" class="ml-auto text-purple-600 font-bold text-lg">0%</span>
    </div>
    <div class="score-bar">
      <div id="progressFill" class="score-fill progress-bar" style="width:0%"></div>
    </div>
    <div class="flex gap-4 mt-3 text-xs text-gray-400">
      <span id="s1" class="flex items-center gap-1">⬜ 搜索新聞</span>
      <span id="s2" class="flex items-center gap-1">⬜ 關鍵字提取</span>
      <span id="s3" class="flex items-center gap-1">⬜ 話題評分</span>
      <span id="s4" class="flex items-center gap-1">⬜ 內容創作</span>
    </div>
  </div>

  <!-- Error Box -->
  <div id="errorBox" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 text-red-700 text-sm"></div>

  <!-- Results Tabs -->
  <div id="resultsSection" class="hidden fade-in">
    <div class="flex gap-2 mb-4">
      <button class="tab-btn active px-5 py-2 rounded-lg text-sm font-medium" onclick="switchTab('a',this)">
        📋 Step A · 關鍵字
      </button>
      <button class="tab-btn px-5 py-2 rounded-lg text-sm font-medium text-gray-600" onclick="switchTab('b',this)">
        🎯 Step B · Top 3 話題
      </button>
      <button class="tab-btn px-5 py-2 rounded-lg text-sm font-medium text-gray-600" onclick="switchTab('c',this)">
        ✍️ Step C · 內容創作
      </button>
    </div>

    <!-- Tab A -->
    <div id="tabA" class="space-y-3"></div>

    <!-- Tab B -->
    <div id="tabB" class="hidden space-y-4"></div>

    <!-- Tab C -->
    <div id="tabC" class="hidden space-y-6"></div>
  </div>

</main>

<!-- Footer -->
<footer class="text-center text-gray-400 text-xs py-6">
  50addoil 內容策劃師 · Powered by Claude AI · 專為香港 50+ 受眾
</footer>

<script>
// ─── State ───────────────────────────────
let currentJobId = null;
let pollTimer = null;
let allResults = null;

// ─── Init ────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('genDate').value = today;
  loadSettings();
});

function loadSettings() {
  const ck = localStorage.getItem('claude_key') || '';
  const sk = localStorage.getItem('serpapi_key') || '';
  if (ck) document.getElementById('claudeKey').value = ck;
  if (sk) document.getElementById('serpKey').value = sk;
}

function saveSettings() {
  localStorage.setItem('claude_key', document.getElementById('claudeKey').value.trim());
  localStorage.setItem('serpapi_key', document.getElementById('serpKey').value.trim());
  const msg = document.getElementById('saveMsg');
  msg.classList.remove('hidden');
  setTimeout(() => msg.classList.add('hidden'), 2000);
}

function toggleSettings() {
  const p = document.getElementById('settingsPanel');
  p.classList.toggle('hidden');
}

// ─── Generate ────────────────────────────
async function startGenerate() {
  const claudeKey = localStorage.getItem('claude_key') || document.getElementById('claudeKey').value.trim();
  if (!claudeKey) {
    alert('請先輸入 Claude API Key（點擊右上角 ⚙️ API 設定）');
    document.getElementById('settingsPanel').classList.remove('hidden');
    return;
  }

  const date = document.getElementById('genDate').value;
  const serpKey = localStorage.getItem('serpapi_key') || '';

  // Reset UI
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('downloadBtn').disabled = true;
  document.getElementById('btnIcon').textContent = '⏳';
  document.getElementById('btnText').textContent = '生成中…';
  document.getElementById('progressBox').classList.remove('hidden');
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('metaBadge').classList.add('hidden');
  setProgress(0, '初始化…');
  resetStepIndicators();

  try {
    const resp = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ claude_key: claudeKey, serpapi_key: serpKey, date })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    currentJobId = data.job_id;
    pollTimer = setInterval(pollStatus, 1500);
  } catch (e) {
    showError(e.message);
    resetBtn();
  }
}

async function pollStatus() {
  if (!currentJobId) return;
  try {
    const resp = await fetch(`/api/status/${currentJobId}`);
    const job = await resp.json();

    setProgress(job.progress || 0, job.message || '');
    updateStepIndicators(job.step);

    if (job.status === 'done') {
      clearInterval(pollTimer);
      allResults = { results: job.results, metadata: job.metadata };
      renderResults(job.results, job.metadata);
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('progressBox').classList.add('hidden');
      document.getElementById('resultsSection').classList.remove('hidden');
      const badge = document.getElementById('metaBadge');
      badge.classList.remove('hidden');
      badge.querySelector('span').textContent = `${job.metadata.week_label}  📅 ${job.metadata.date}`;
      resetBtn();
    } else if (job.status === 'error') {
      clearInterval(pollTimer);
      showError(job.message);
      resetBtn();
    }
  } catch (e) {
    clearInterval(pollTimer);
    showError('連線失敗：' + e.message);
    resetBtn();
  }
}

function setProgress(pct, msg) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  if (msg) document.getElementById('progressMsg').textContent = msg;
}

function resetStepIndicators() {
  ['s1','s2','s3','s4'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('text-purple-600','text-green-600');
    el.classList.add('text-gray-400');
    el.textContent = el.textContent.replace('✅','⬜').replace('🔄','⬜');
  });
}

function updateStepIndicators(step) {
  const map = {
    'searching': ['s1'],
    'step_a': ['s2'],
    'step_a_done': ['s2'],
    'step_b': ['s3'],
    'step_b_done': ['s3'],
    'step_c': ['s4'],
    'complete': ['s4'],
  };
  const labels = { s1: '搜索新聞', s2: '關鍵字提取', s3: '話題評分', s4: '內容創作' };
  const order = ['s1','s2','s3','s4'];
  const activeIdx = { searching:0, step_a:1, step_a_done:1, step_b:2, step_b_done:2, step_c:3, complete:3 }[step] ?? -1;

  order.forEach((id, i) => {
    const el = document.getElementById(id);
    if (i < activeIdx) {
      el.textContent = `✅ ${labels[id]}`;
      el.className = 'flex items-center gap-1 text-green-600';
    } else if (i === activeIdx) {
      el.textContent = `🔄 ${labels[id]}`;
      el.className = 'flex items-center gap-1 text-purple-600 font-semibold';
    } else {
      el.textContent = `⬜ ${labels[id]}`;
      el.className = 'flex items-center gap-1 text-gray-400';
    }
  });
}

function resetBtn() {
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('btnIcon').textContent = '🚀';
  document.getElementById('btnText').textContent = '生成今日內容';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '❌ ' + msg;
  box.classList.remove('hidden');
  document.getElementById('progressBox').classList.add('hidden');
}

// ─── Tab switching ────────────────────────
function switchTab(tab, btn) {
  ['tabA','tabB','tabC'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab' + tab.toUpperCase()).classList.remove('hidden');
  btn.classList.add('active');
}

// ─── Render Results ───────────────────────
function renderResults(results, metadata) {
  renderStepA(results.step_a || []);
  renderStepB(results.step_b || {});
  renderStepC(results.step_c || []);
}

function renderStepA(items) {
  const container = document.getElementById('tabA');
  container.innerHTML = '';
  if (!items.length) { container.innerHTML = '<p class="text-gray-400">無資料</p>'; return; }

  const grid = document.createElement('div');
  grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card p-4 fade-in';
    card.style.animationDelay = (i * 0.05) + 's';
    const kws = (item.keywords || []).map(k => `<span class="keyword-tag">${k}</span>`).join('');
    card.innerHTML = `
      <div class="flex items-start gap-3 mb-3">
        <div class="step-badge bg-purple-100 text-purple-700">${i+1}</div>
        <div>
          <h3 class="font-semibold text-gray-800">${item.theme || ''}</h3>
          <p class="text-xs text-gray-400">${item.week_label || ''} · ${item.generated_date || ''}</p>
        </div>
      </div>
      <div class="mb-3">${kws}</div>
      <p class="text-sm text-gray-600 leading-relaxed">${item.news_context || ''}</p>
      ${item.source_url ? `<a href="${item.source_url}" target="_blank" class="text-xs text-purple-500 hover:underline mt-2 block truncate">🔗 ${item.source_url}</a>` : ''}
    `;
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function renderStepB(stepB) {
  const container = document.getElementById('tabB');
  container.innerHTML = '';
  const top3 = stepB.top_3 || [];
  if (!top3.length) { container.innerHTML = '<p class="text-gray-400">無資料</p>'; return; }

  top3.forEach((item, i) => {
    const rankClass = ['rank-1','rank-2','rank-3'][i] || '';
    const rankEmoji = ['🥇','🥈','🥉'][i] || `#${i+1}`;
    const total = (item.total_score || 0);
    const maxScore = 30;
    const pct = Math.round(total / maxScore * 100);

    const card = document.createElement('div');
    card.className = `card p-5 fade-in ${rankClass}`;
    card.style.animationDelay = (i * 0.1) + 's';
    card.innerHTML = `
      <div class="flex items-start gap-4">
        <div class="text-3xl">${rankEmoji}</div>
        <div class="flex-1">
          <h3 class="font-bold text-gray-800 text-lg leading-snug">${item.topic || ''}</h3>
          <p class="text-sm text-gray-600 mt-1">${item.one_liner || ''}</p>
          <div class="flex flex-wrap gap-2 mt-2">
            <span class="bg-white/70 text-purple-700 text-xs px-2 py-0.5 rounded-full">${item.emotion_type || ''}</span>
            <span class="bg-white/70 text-blue-700 text-xs px-2 py-0.5 rounded-full">${item.post_type || ''}</span>
            <span class="bg-white/70 text-gray-600 text-xs px-2 py-0.5 rounded-full">角度 ${item.source_angle || ''}</span>
          </div>
        </div>
        <div class="text-right min-w-[80px]">
          <div class="text-2xl font-black text-purple-700">${total}</div>
          <div class="text-xs text-gray-500">/ ${maxScore}分</div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3 mt-4">
        ${[['情感共鳴',item.emotion_score],['分享動力',item.share_score],['實用性',item.utility_score]].map(([label, score]) => `
          <div>
            <div class="flex justify-between text-xs text-gray-500 mb-1"><span>${label}</span><span>${score}/10</span></div>
            <div class="score-bar"><div class="score-fill" style="width:${(score/10*100)}%"></div></div>
          </div>`).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function renderStepC(items) {
  const container = document.getElementById('tabC');
  container.innerHTML = '';
  if (!items.length) { container.innerHTML = '<p class="text-gray-400">無資料</p>'; return; }

  items.forEach((item, i) => {
    const rankEmoji = ['🥇','🥈','🥉'][i] || `#${i+1}`;
    const topic = item.source_topic || {};

    const card = document.createElement('div');
    card.className = 'card p-6 fade-in';
    card.style.animationDelay = (i * 0.1) + 's';
    card.innerHTML = `
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">${rankEmoji}</span>
        <h3 class="font-bold text-gray-800 text-lg">${item.blog_title || topic.topic || ''}</h3>
      </div>

      <div class="flex flex-wrap gap-2 mb-5">
        ${(item.seo_keywords || []).map(k => `<span class="keyword-tag">🔍 ${k}</span>`).join('')}
        ${item.image_prompt ? `<span class="bg-blue-50 text-blue-600 text-xs px-3 py-1 rounded-full">🖼 ${item.image_prompt.substring(0,60)}…</span>` : ''}
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <!-- FB Post -->
        <div class="content-block">
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-semibold text-blue-700 flex items-center gap-2">
              <span class="bg-blue-100 text-blue-600 text-xs px-2 py-0.5 rounded">Facebook</span>
              帖文
            </h4>
            <button class="copy-btn text-xs text-gray-400 hover:text-purple-600 transition"
              onclick="copyText(this, '${escapeForAttr(item.fb_post)}')">📋 複製</button>
          </div>
          <div class="bg-blue-50 rounded-lg p-4 text-sm text-gray-700 leading-relaxed cursor-pointer"
            onclick="copyText(null, '${escapeForAttr(item.fb_post)}', this)">
            <pre>${escapeHtml(item.fb_post || '')}</pre>
          </div>
        </div>

        <!-- Blog -->
        <div class="content-block">
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-semibold text-green-700 flex items-center gap-2">
              <span class="bg-green-100 text-green-600 text-xs px-2 py-0.5 rounded">Blog</span>
              文章
            </h4>
            <button class="copy-btn text-xs text-gray-400 hover:text-purple-600 transition"
              onclick="copyText(this, '${escapeForAttr(item.blog_article)}')">📋 複製</button>
          </div>
          <div class="bg-green-50 rounded-lg p-4 text-sm text-gray-700 leading-relaxed max-h-96 overflow-y-auto cursor-pointer"
            onclick="copyText(null, '${escapeForAttr(item.blog_article)}', this)">
            <pre>${escapeHtml(item.blog_article || '')}</pre>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// ─── CSV Download ────────────────────────
async function downloadCSV() {
  if (!allResults) return;
  try {
    const resp = await fetch('/api/download-csv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(allResults)
    });
    if (!resp.ok) throw new Error('下載失敗');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = allResults.metadata?.date || new Date().toISOString().split('T')[0];
    a.href = url;
    a.download = `50addoil_${date}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('❌ ' + e.message);
  }
}

// ─── Utilities ───────────────────────────
function escapeHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeForAttr(str) {
  return (str || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
}
function copyText(btn, text, container) {
  const decoded = text.replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  navigator.clipboard.writeText(decoded).then(() => {
    if (btn) { btn.textContent = '✅ 已複製'; setTimeout(()=>btn.textContent='📋 複製',2000); }
    if (container) {
      const orig = container.style.background;
      container.style.background = '#d1fae5';
      setTimeout(()=>container.style.background=orig, 600);
    }
  });
}
</script>
</body>
</html>
